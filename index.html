<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TinFit Coach</title>

<!-- این‌جا مانیفست واقعی و در سطح بالای صفحه است؛ همین چیزی که تا الان گم بود -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TinFit">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f6f8; }
  #appFrame {
    position:fixed; inset:0; width:100%; height:100%;
    border:0; display:block;
  }
  /* یک لودینگ ساده تا iframe بالا بیاید */
  #loadingScreen{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#f4f6f8; gap:14px; font-family:Tahoma,Arial,sans-serif; color:#2F5233; z-index:2;
  }
  #loadingScreen img{ width:84px; height:84px; }
  .spinner{
    width:34px; height:34px; border:4px solid #dfe7e1; border-top-color:#2F5233;
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

  <div id="loadingScreen">
    <img src="icons/icon-192.png" alt="TinFit">
    <div class="spinner"></div>
  </div>

  <!--
    ⚠️ مهم‌ترین خط این فایل همین زیر است:
    به‌جای PLACEHOLDER، آدرس دیپلوی واقعی اپس‌اسکریپت خودتان را بگذارید
    (از Apps Script → Deploy → Manage deployments → Web app URL، چیزی شبیه:
     https://script.google.com/macros/s/AKfycb.../exec)
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbw1IyqoaqUkgXolX6fgoUyq3dGA01JzKX5h9tIN2_205pGsISb3MrqV8kH6irI7uKMx/exec"
    title="TinFit Coach"
    allow="clipboard-write; camera; microphone"
    onload="document.getElementById('loadingScreen').style.display='none'">
  </iframe>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('SW registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
